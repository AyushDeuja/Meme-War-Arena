[package]
name = "meme-wars"
version = "0.1.0"
description = "Meme Wars Arena onchain match state"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "meme_wars"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor"] }

